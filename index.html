<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MFA Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1 class="site-title">ITT‑640 MFA Website Prototype</h1>

<div class="login-container">
    <div class="login-box">
        <h2>Sign in to your MFA account</h2>
        <p>Secure access</p>

        <label>Email Address</label>
        <input type="email" placeholder="you@live.com">

        <label>Password</label>
        <input type="password" placeholder="••••••••">
        <a class="forgot" href="https://pnutlicious.github.io/ITT-640-MFA-Settings/">Forgot password?</a>

        <button><a href="https://pnutlicious.github.io/ITT-640-MFA-Authentication/#">Sign In</a></button>

        <p class="create">No account yet? <a href="https://pnutlicious.github.io/ITT-640-MFA-Create-Account/">Create account</a></p>

        <p class="encryption">256-bit TLS encryption</p>
    </div>
</div>

</body>
</html>
